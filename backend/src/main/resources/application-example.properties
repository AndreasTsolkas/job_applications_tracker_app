spring.application.name=job_applications_tracker
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/job_applications_tracker
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Must be at least 32 characters (HS256 requires a 256-bit key)
jwt.secret=YOUR_JWT_SECRET_AT_LEAST_32_CHARACTERS_LONG
# Token lifetime in milliseconds (3600000 = 1 hour)
jwt.expiration=3600000

springdoc.api-docs.path=/api-docs